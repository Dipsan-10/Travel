<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Defensive fix for sandboxed environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Sandbox fetch override failed:', e);
        }
      })();
    </script>

    <title>Nepa Travel | ネパール観光旅行・ヒマラヤトレッキング専門エージェント</title>
  </head>
